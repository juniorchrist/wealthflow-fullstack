# ============================================================
#  render.yaml — WealthFlow Backend (Render Web Service)
#
#  Déploiement automatique depuis GitHub.
#  Repository complet: wealthflow-frontend (contient backend/ et src/)
#  Build directory: backend/
#  Runtime: Node.js 20
# ============================================================

services:
  - type: web
    name: wealthflow-api
    runtime: node
    region: frankfurt   # Choisir la région la plus proche (oregon, frankfurt, singapore...)
    plan: free          # Peut être changé en "starter" pour éviter les cold starts

    # ── Source ──────────────────────────────────────────────
    # Le repository complet est wealthflow-frontend, le backend est dans backend/
    # Pas de rootDir - on utilise cd dans les commandes

    # ── Build ───────────────────────────────────────────────
    buildCommand: cd backend && npm ci --include=dev && npm run prisma:generate && npm run build
    # npm ci (npm clean-install) est plus fiable que npm install pour les déploiements
    # --include=dev assure que les dépendances TypeScript (@types/*) sont installées

    # ── Start ───────────────────────────────────────────────
    startCommand: cd backend && npm run start

    # ── Variables d'environnement ───────────────────────────
    # ⚠️  NE PAS mettre les valeurs secrètes ici → les configurer
    #      directement dans l'interface Render > Environment
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false    # À renseigner manuellement dans Render Dashboard

      - key: JWT_SECRET
        sync: false    # À renseigner manuellement dans Render Dashboard

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: CORS_ORIGIN
        sync: false    # Ex: https://wealthflow.netlify.app

    # ── Health Check ────────────────────────────────────────
    healthCheckPath: /api/health

    # ── Auto Deploy ─────────────────────────────────────────
    autoDeploy: true
