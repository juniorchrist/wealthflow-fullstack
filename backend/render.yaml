services:
  - type: web
    name: wealthflow-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: NODE_ENV=production npm run prisma:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
