<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Titre et Description -->
    <title>WealthFlow — Gestion Financière Personnelle</title>
    <meta name="description" content="Application SaaS de gestion financière personnelle en Franc CFA (FCFA) avec suivi des budgets, tirelires d'épargne, analyse de dépenses et stratégie financière." />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Icônes et Favicons -->
    <link rel="icon" type="image/jpeg" href="/pwa-icon-original.jpg" />
    <link rel="apple-touch-icon" href="/pwa-icon-original.jpg" />
    <link rel="shortcut icon" href="/pwa-icon-original.jpg" />
    
    <!-- Métadonnées PWA pour iOS/Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Métadonnées PWA pour Android/Chrome -->

    <meta name="theme-color" content="#FF5330" />

    <meta name="twitter:image" content="/pwa-icon-original.jpg" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
